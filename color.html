<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setinterval</title>
</head>
<body>
    <h1> Changing Background color Using set interval <hr></h1>
    <button onClick="sto()">Stop colors</button>
    <script>
        var t 
        var r,g,b,c
        function show(){
            r = Math.round(Math.random()*255)
            g = Math.round(Math.random()*255)
            b = Math.round(Math.random()*255)
            c = `rgb(${r},${b},${g})`
            document.body.style.background=c
        }
        t= setInterval("show()",1000)
        function sto ()
        {
            clearInterval(t)
            alert("Set interval is stop now")
        }
        function mreload()
    {
        window.loction.reload()
    }
    document.write("<button onClick='location.reload()'>Start Again</button>")
        
    </script>
</body>
