    <header>
         Playing With Numbers
    </header>
    <h1>
        Insert no. 1<input type="number" id="t1" value="0">
        <br>Insert no. 2<input type="number" id="t2" value="0"></br></br>
        Result<input id="r" type="number" id="t3" value="0">
            </br></br>
        <button onclick="f1()">ADD(+)</button>
        <button onclick="f2()">MINUS(-)</button>
        <button onclick="f3()">MULTIPLY(X)</button>
        <button onclick="f4()">DIVIDE(/)</button>
    </h1>
    <script>
        
   var n1 = document.getElementById("t1")
   
   var n2 = document.getElementById("t2")
   
   var n3 = document.getElementById("r")

   function f1()
   {
    //alert("chal raha hai ")
 var sum = parseInt(n1.value)+parseInt(n2.value)
 n3.value=sum
   }
    function f2()
   {
 var sum = parseInt(n1.value)-parseInt(n2.value)
 n3.value=sum
   }
    function f3()
   {
 var sum = parseInt(n1.value)*parseInt(n2.value)
 n3.value=sum
   }
    function f4()
   {
 var sum = parseInt(n1.value)/parseInt(n2.value)
 n3.value=sum
   }
   document.title="calculation"
   document.body.style.background="#f9d6e3"
   
    </script>
