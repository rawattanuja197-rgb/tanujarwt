<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>animation</title>
</head>
<style>
    @keyframes ani{
        from{ transform: rotateY(0deg) rotateX(0deg) rotateZ(0deg);}
        to{ transform: rotateY(360deg) rotateX(60deg) rotateZ(10deg);}

    }
    *{
        margin: 0%;
        padding: 0%;
    }
    #container{
        width: 500px;
        height:500px;
        //background-color: aqua;
        margin: auto;
        text-align: center;
        perspective: 700px;
    }
    #p1{
        width: 300px;
        height: 400px;
        //background-color: aqua;
        position: relative;
        top: 80px;
        left: 80px;
        animation:ani 5s linear infinite alternate;
    }
    #p2{
        width: 300px;
        height: 400px;
        //background-color: aqua;
        position: relative;
        top: -320px;
        left: 80px;
        backface-visibility: hidden;
        animation: ani 5s linear infinite alternate;
    }
    .pic{
        width: 100%;
        height: 100%;
    }
    h1{
        background-color: #670D2F;
        color: #f5e6ec;
        text-align: center;
        padding: 15px;
        box-shadow: rgba(0, 0, 0, 0.447) 5px 5px 5px ;
    }
    body{
        background: #f9d6e3;
    }
    .foot{
        background: #670D2F;
        padding: 20px;
        text-align: center;
        color: #f5e6ec;
        margin-top: 63.5px;

    }
    .end{
        background: #4d0621;
        color: #f5e6ec;
        padding: 10px;
       text-align: center;
       
    }
    
</style>
<body>
    <header>
        <h1>3D Animation in HTML</h1>
    </header>
    <div id="container">
        <div id="p1">
            <img src="images/f10.png" class="pic">

        </div>
        <div id="p2">
            <img src="images/f11.png" class="pic">
        </div>
    </div>
    <footer>
        <div class="foot">
        <p class="email">Email:rawattanuja197@gmail.com</p>
       </div>
        <div class="end">
        <p class="copyright"><u>&copy;Tanuja Rawat 2026| All right reserved.</u></p>
    </div>
    </footer>
    
</body>
</html>
