<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
<style>
    #menu{
      
        width:25px;
        height: 20px;
    }
    ol{
        background: #670D2F;
        list-style: none;
        transition: 0.53s;
        //margin-left: -230px;
        position: relative;
        left: -200px;
        top: -23px;
        color:white;

    }
    ol li{
        padding: 10px;
        margin-left: -40px;

    }
    ol li:hover{
        background: #45051e8c;
        color: #e989ae;

    }
    #menu:hover ol{
        left:0px;
        width:100px;
        cursor: pointer;

    }
    body{
        background: #f4d4e0;
    }

</style>
<body>

    <main>
        <div id="menu">
            <span class="material-symbols-outlined">
menu
</span>
            <ol>
                <li>HOME</li>
                <li>ABOUT</li>
                <li>CONTACT</li>
                <li>PRODUCTS</li>
                <li>SERVICES</li>
            </ol>
        </div>
    </main>
    
</body>
</html>
