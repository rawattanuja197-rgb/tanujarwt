<head><link rel="preconnect" href="https://fonts.googleapis.com">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>banner</title>
</head>
<style>
    *{
        padding: 0;
        margin: 0;
    }body{
        background-color: #FFB2B2;
    }
    .pic{
        width: 50%;
        height: 70%;
        position: absolute;
        left: 25%;
        transition: 2s;
        margin-top: 20px;border-radius: 20px;
    }
   h1{ font-family: "IM Fell Double Pica", serif;
  font-style: italic;
    text-align: center;padding: 10px;border-bottom-left-radius:20px ;border-bottom-right-radius: 20px;
    background-color: #E36A6A;color: white;
   }
   footer{
    margin-top: 600px;
   }
   .end{text-align: center;background-color: #E36A6A;color: white;padding: 6px;}
   .foot{
    text-align: center;color: white;background-color: #f99d9d;padding: 5px;
   }
</style>
<body>
    <h1> Froasting Banner</h1>
    <header>
        <div class="banner">
        <img src="images/f7.jpg" class="pic">
        <img src="images/f8.jpg" class="pic">
        <img src="images/f1.jpg" class="pic">
        <img src="images/f9.jpg" class="pic">
    </div>
    </header>
    <script>
        var plist = document.getElementsByTagName("img")
        var p1 = plist[3]
        var p2 = plist[2]
        var p3 = plist[1]
        var p4 = plist[0]
        var c = -1
        function runbanner()
        {
            switch(c)
            {
                case 0 :
                    p1.style.opacity=0
                    break;
                    case 1 :
                        p2.style.opacity=0
                        break;
                        case 2 :
                        p3.style.opacity=0
                        break;
                        case 3 :
                           
                            break;
                        case 4 :
                        p1.style.opacity=1
                        p2.style.opacity=1
                        p3.style.opacity=1
                        p4.style.opacity=1
                        break;
            }
            if(c<=plist.length)
            {
                c++
            }
            else
            {
                c=0
            }
            setTimeout("runbanner()",4000)
        }
        runbanner()
    </script>
