<style>
    *{
        padding: 0%;margin: 0%; font-family: "Ribeye", serif;
  font-weight: 400;
  font-style: normal;
    }
    button{
        width: 25px;
        height: 50px;margin-left: 150%;
        border-radius: 100px;margin-top: 80%;
        cursor:url("images/point.png"),auto;
    }
    h1{margin-bottom: 1%;font-size: 40px;border: dotted 3px rgb(120, 25, 25);
        background: pink;text-align: center;padding: 20px;color: rgb(138, 22, 22);border-bottom-left-radius: 20px;border-bottom-right-radius: 20px;
    }
    .buttonnew{
        width: 20%;margin-top: 1%;font-size: 20px;margin-left: 2%;
        background-color:pink ;border: brown dotted;color: brown;
    }
    .end{
        background: brown;text-align: center;color: white;padding: 2px;
    }
    .foot{background: pink;text-align: center;padding: 10px;color: brown;margin-top: 10%;

    }
    @media (max-width:600px){
         *{
        padding: 0%;margin: 0%; font-family: "Ribeye", serif;
  font-weight: 400;
  font-style: normal;
    }
    button{
        width: 25px;
        height: 44px;margin-left: 25%;
        border-radius: 100px;margin-top: 10%;
        cursor:url("images/point.png"),auto;
    }
    h1{margin-bottom: 1%;font-size: 40px;border: dotted 3px rgb(120, 25, 25);
        background: pink;text-align: center;padding: 15px;color: rgb(138, 22, 22);border-bottom-left-radius: 20px;border-bottom-right-radius: 20px;
    }
    .buttonnew{
        width:26%;margin-top: 3%;font-size: 15px;margin-left: 5%;
        background-color:pink ;border: brown dotted;color: brown;
    }
    .end{
        background: brown;text-align: center;color: white;padding: 2px;
    }
    .foot{background: pink;text-align: center;padding: 10px;color: brown;margin-top: 10%;

    } 
    }
</style>
<body>

    <h1>color palette</h1>
    
    <table border="0" cellpadding="1">
        <script>
            var row = 10
            var col = 10
            var c = 1
            while(c<=row)
        {
            document.write("<tr>")
                for (var i = 1;i<=col;i++)
            {
                var red = Math.round(Math.random()*255)
                var green = Math.round(Math.random()*255)
                var blue = Math.round(Math.random()*255)
                var mycolor=`rgb(${red},${green},${blue})`
                 
                document.write("<td><button onclick='setcolor(this)' style='color:red;background:"+mycolor+"'></button>")
             }
             document.write("</tr>")
             c++
             function setcolor(d)
             {
                alert(d.style.background)
                document.body.style.background= d.style.background
             }
             function mreload()
             {
                window.location.reload()
             }
             
        }
        document.write("<button class='buttonnew' onclick='location.reload()'>Click for new Palette</button>")
        </script>
        
    </table>

</body>
