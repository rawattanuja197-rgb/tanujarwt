    }
    button{

    }
    h1{
        background: #670D2F;

    }
    body{

@media(max-width:600px){
#clock{
        background: #670D2F;
        color: white;
        padding: 20px;
        width: 250px;
        text-align: center;
        border-radius: 20px;
        margin-bottom: 30px;
        margin-top: 30px;
        box-shadow: 1px 1px 10px black;
        margin-top: 200px ;

    }
    button{
        background: #670D2F;

    }
    h1{
        background: #670D2F;
        color: white;

        box-shadow: 1px 1px 10px black;
        text-align: center;

    }
}
</style>
<body>
    <h1>
        CLOCK IN JAVASCRIPT
    </h1>
    <div id="clock">TIME</div>
    <button onClick="st()">Start Clock</button>
    <button onClick="sto()">Stop Clock</button>
    <script>
        function show()
        {
            var d = new Date()
            var t = document.getElementById("clock")
            t.innerHTML = d.toLocaleTimeString()
        }
        var timer
        function st()
        {
            timer = setInterval("show()",1000)
        }
        function sto()
        {
            clearInterval(timer)
        }
        document.title="noerror"
    </script>

</body>
