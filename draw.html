<!DOCTYPE html>
<html lang="en">
<head><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>  
        *{
            padding: 0%;margin: 0%;
        }
        h1{
            text-align: center;font-family: "Rye", serif;
  font-weight: 400;background-color:  #E36A6A;color: white;
  padding :10px;
        }
        .foot{text-align: center;font-family: "Rye", serif;
  font-weight: 400;}.end{text-align: center;font-family: "Rye", serif;
  font-weight: 400;}
    </style>
    <h1>
        DRAW 
    </h1>
    <canvas id="mycan" style="background-color:  #FFB2B2;" width="600" height="600"></canvas>
    <script>
        var c = document.getElementById("mycan");
     var k;
        var r = 10
        var d = c.getContext("2d");
         c.width = window.innerWidth;
        c.height = window.innerHeight;
         var red, green, blue ,drawcolor   

        function f1(event)
        {
          
            k = event.key
            
            switch(k)
            {
                case "r":
                    if(r<100)
                    {
                        r=r+1
                        document.title= r
                    }
                    break;
                    
                    case "t":
                        if(r>10)
                        {
                            r=r-1
                            document.title=r
                        }
                        break;

                        case " ":
                            d.clearRect(0,0,window.innerWidth,window.innerHeight)
                            break;
            }
        }
            function draw(event)
            {
                var x = event.pageX
                var y = event.pageY
                red = Math.round(Math.random()*255)
                green = Math.round(Math.random()*255)
                blue= Math.round(Math.random()*255)
                drawcolor = "rgb("+red+","+green+","+blue+")"

                d.beginPath();

                d.arc(x,y,r,0,2 * Math.PI);
                d.fillStyle = drawcolor
                d.fill()
                d.stroke();
            }
            
            document.addEventListener("keydown",f1)
            document.addEventListener("mousemove",draw)
        

    </script>

        <div class="foot"><p>Email:rawattanuja197@gmail.com</p></div>
        <div class="end"><p>&copy;Tanuja Rawat 2026|All Right Reserved</p></div>
    </footer>
</body>
</html>
