<style>
  h1{
    text-align: center;
    font-family: "Geist Pixel", sans-serif;
  font-optical-sizing: auto;
  font-weight: 900;
  font-style: normal;
  font-variation-settings:
    "ELSH" 0;
    color: rgb(240, 239, 239);
    padding: 12px;
    background-color: rgb(61, 61, 61);
  }
  .foot{

    padding: 6px;

  color: white;
  padding: 3px;
  background-color: rgb(61, 61, 61);
  }
</style>
<body>
    <h1>PIXEL POP</h1>
  <canvas id="mycan" style="background: rgb(21, 21, 21);" width="600" height="600"></canvas>
  <script>
    var c = document.getElementById("mycan");
    var k;
    var r=10
    var d= c.getContext("2d");
    c.width = window.innerWidth;
    c.height = window.innerHeight;
    var red,green,blue,drawcolor
    var drawmode="red"
    function pixel(){
        var x = Math.round(Math.random()*window.innerWidth)
        var y = Math.round(Math.random()*window.innerHeight)
        red = Math.round(Math.random()*255)
       green = Math.round(Math.random()*255)
        blue = Math.round(Math.random()*255)
        drawcolor="rgb("+red+","+green+","+blue+")"
        d.beginPath();


        d.arc(x,y,Math.random()*2,0,3*Math.PI);
        d.fillStyle=drawcolor
        d.fill()
        document.title=x
    }
    setInterval("pixel()",10)
  </script>
