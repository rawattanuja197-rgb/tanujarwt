width: 450px;margin-top: 50px;

border-radius: 20px;width: 100%;

border-radius: 20px;width: 100%;

font-size: 20px;

<body>
    <h1>

  <script>
    var p = document.createElement("div")
    function show(){
        document.body.appendChild(p)
        p.className="mystyle"
        p.innerHTML="<button onclick='body.removeChild(p)'style='margin-left:90%;font-size:20px;border:0;'>x</button>"
        p.innerHTML+="<br/><img style='width:100%;padding-top:5px;' src='images/z1.jpg'>"
        //setTimeout("closeadd()",10000)

    }
    var t =setTimeout("show()",2000)
    function closeadd(){
        document.body.removeChild(p)
    }
