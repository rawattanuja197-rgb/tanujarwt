        document.write("<h1 style='text-align:center;background:#670D2F;color:white;padding:10px;box-shadow:1px 1px 10px black;margin-bottom:20px;'>Creating Random Colors</h1>")
        var b = document.createElement("button")
        
        
        b.innerHTML="Click to create Random Colors"
        document.body.appendChild(b)
        function Randomcolor()
        
        {
            var red= Math.round(Math.random()*255)
            var green= Math.round(Math.random()*255)
            var blue= Math.round(Math.random()*255)
            var c ="rgb("+red+","+green+","+blue+")"
           //alert(c)
            document.body.style.background = c
           
        }
        b.onclick = Randomcolor
         document.title="colors"
          

        
    </script>
